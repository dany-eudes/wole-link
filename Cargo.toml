[package]
name = "wole-link"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shows a QR code that registers this computer in the WOL•E Wake-on-LAN app"
publish = false

[dependencies]
qrcodegen = "1.8.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_Globalization"] }
