# Tests and builds on every push; on a v* tag, a draft release with the four files, their
# SHA-256 sums and, once the MINISIGN_KEY secret exists, a minisign signature of the sums.
# Once the SIGNPATH_API_TOKEN secret exists, the two Windows .exe files are Authenticode-signed
# through SignPath (free code signing for open-source projects) before the release is drafted;
# each signing request waits for a manual approval in SignPath.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Zig links static musl binaries for both architectures from the same x86_64 runner.
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo test
      - name: Build
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Check it's static
        run: |
          file target/${{ matrix.target }}/release/wole-link
          file target/${{ matrix.target }}/release/wole-link | grep -q "statically linked"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/wole-link
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      # Only system DLLs: no VC++ runtime to install (static CRT, .cargo/config.toml).
      - name: Check its DLLs
        shell: bash
        run: |
          dumpbin=$(find "/c/Program Files/Microsoft Visual Studio" -name dumpbin.exe -path "*Hostx64/x64*" | head -1)
          for exe in wole-link wole-link-cli; do
            "$dumpbin" //dependents target/x86_64-pc-windows-msvc/release/$exe.exe | tee -a deps.txt
          done
          ! grep -iE "vcruntime|msvcp|api-ms-win-crt" deps.txt
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: x86_64-pc-windows-msvc
          path: |
            target/x86_64-pc-windows-msvc/release/wole-link.exe
            target/x86_64-pc-windows-msvc/release/wole-link-cli.exe
          if-no-files-found: error
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

  # The artifact configuration (which files, product name and version they must carry) lives in
  # SignPath; .signpath/artifact-configuration.xml is the copy kept here.
  sign:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Submit to SignPath and wait for the approval
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.windows.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed
      - name: Check the signatures
        if: env.SIGNING == 'true'
        run: |
          sudo apt-get install -y osslsigncode
          for exe in wole-link wole-link-cli; do
            osslsigncode verify -in signed/$exe.exe > verify.txt 2>&1 || true
            cat verify.txt
            grep -q "SignPath Foundation" verify.txt
          done
      - if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-signed
          path: |
            signed/wole-link.exe
            signed/wole-link-cli.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Name the files
        run: |
          v=${GITHUB_REF_NAME#v}
          mkdir dist
          win=artifacts/windows-signed
          [ -d "$win" ] || { win=artifacts/x86_64-pc-windows-msvc; echo "::warning::Windows files not code-signed"; }
          cp $win/wole-link.exe "dist/wole-link-$v-windows-x86_64.exe"
          cp $win/wole-link-cli.exe "dist/wole-link-cli-$v-windows-x86_64.exe"
          cp artifacts/x86_64-unknown-linux-musl/wole-link "dist/wole-link-$v-linux-x86_64"
          cp artifacts/aarch64-unknown-linux-musl/wole-link "dist/wole-link-$v-linux-arm64"
          chmod +x dist/wole-link-*-linux-*
          cd dist && sha256sum wole-link-* > SHA256SUMS && cat SHA256SUMS
      - name: Sign the sums
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        if: env.MINISIGN_KEY != ''
        run: |
          sudo apt-get install -y minisign
          printf '%s\n' "$MINISIGN_KEY" > key.txt
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s key.txt -m dist/SHA256SUMS
          rm key.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "WOL•E Link $GITHUB_REF_NAME" --generate-notes
